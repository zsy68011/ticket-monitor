name: ticket-monitor
on:
  schedule:
    # UTC 时间，错开整点减少排队延迟；等效北京时间每 15 分钟一次
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ticket-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WPUSHER_APP_TOKEN: ${{ secrets.WPUSHER_APP_TOKEN }}
          WPUSHER_UID: ${{ secrets.WPUSHER_UID }}
        run: python monitor.py

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "chore: 更新监控状态 [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
# ok
