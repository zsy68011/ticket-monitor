# 开票监控配置
months_ahead: 2          # 监控当月起共 3 个月（当月 + 2）
push_upcoming: true      # 新演出官宣「即将开票」即推送，开票时再推一条
venues:
  ncpa: true             # 国家大剧院本部（歌剧院/音乐厅/戏剧场/小剧场）
  bpac: true             # 北京艺术中心
  taihu: false           # 台湖舞美艺术中心（不需要可保持 false）
  cnto: true             # 中央民族乐团·民族音乐厅（开票公告文章）
  bjyt: true             # 北京音乐厅（官方API，在售/待售项目）
  zsyt: true             # 中山公园音乐堂（官方授权订票站列表）
  gtys: true             # 国图艺术中心（官网屏蔽海外IP，走购票通渠道）
  clcn: true             # 首都图书馆（含剧场公益演出，仅推演出类）
  xsd: true              # 北京朝阳·宣传文化中心（仅推演出/抢票类公告）
